<!DOCTYPE html>
<html lang="en">
<head>
    <title>Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #43e97b, #38f9d7);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
        }
    </style>
</head>

<body>

<div class="card shadow text-center">

    <h3 class="mb-3">Result</h3>

    <h4 class="{% if 'Phishing' in result %}text-danger{% else %}text-success{% endif %}">
        {{ result }}
    </h4>

    <p class="mt-3 text-muted">
        This prediction is based on patterns commonly found in phishing websites 
        such as suspicious keywords, unusual URL structure, and security indicators.
    </p>

    <a href="/" class="btn btn-outline-dark mt-3">🔙 Check Another</a>

</div>

</body>
</html>
