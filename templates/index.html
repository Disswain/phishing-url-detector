<!DOCTYPE html>
<html>
<head>
    <title>Phishing Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f4f6f9;">

<div class="container text-center mt-5">
    <h2>🔐 Phishing Website Detection</h2>
    <h5 class="text-muted">Model Accuracy: {{ (accuracy * 100) | round(2) }}%</h5>

    <div class="card p-4 shadow mt-4">
        <form method="POST">
            <input type="text" name="url" class="form-control mb-3" placeholder="Enter URL" required>
            <button class="btn btn-primary w-100">Check</button>
        </form>
    </div>
</div>

</body>
</html>
